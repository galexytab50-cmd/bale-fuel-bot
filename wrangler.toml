name = "bale-fuel-bot"
main = "src/index.ts"
compatibility_date = "2024-09-25"

# ---------------------------------------------------------------------------
# D1 Database: برای نگه‌داشتن وضعیت مکالمه هر کاربر (چون Worker حالت رو
# بین درخواست‌ها نگه نمی‌داره، باید تو یه جای بیرونی ذخیره بشه).
#
# مراحل ساخت:
#   npx wrangler d1 create bale-fuel-bot-db
# خروجی این دستور یه database_id بهت میده که باید جایگزین
# YOUR_D1_DATABASE_ID بشه.
#
# بعد از ساخت، جدول لازم رو با این دستور بساز:
#   npx wrangler d1 execute bale-fuel-bot-db --file=./schema.sql --remote
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "bale-fuel-bot-db"
database_id = "e8343b82-0530-49ae-8ab1-66438bef5617"
# ---------------------------------------------------------------------------
# متغیر محیطی توکن بات:
# توی محیط لوکال از فایل .dev.vars خونده می‌شه (نمونه‌اش .dev.vars.example هست).
# روی سرور Cloudflare با این دستور ست می‌شه (و اینجا نوشته نمی‌شه، چون secret است):
#   npx wrangler secret put BALE_TOKEN
# ---------------------------------------------------------------------------
