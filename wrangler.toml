name = "bale-fuel-bot"
main = "src/index.ts"
compatibility_date = "2024-09-25"

# ---------------------------------------------------------------------------
# KV Namespace: برای نگه‌داشتن وضعیت مکالمه هر کاربر (چون Worker حالت رو
# بین درخواست‌ها نگه نمی‌داره، باید تو یه جای بیرونی ذخیره بشه).
#
# مراحل ساخت:
#   npx wrangler kv namespace create BOT_STATE
# خروجی این دستور یه id بهت میده که باید جایگزین YOUR_KV_NAMESPACE_ID بشه.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "BOT_STATE"
id = "YOUR_KV_NAMESPACE_ID"

# ---------------------------------------------------------------------------
# متغیر محیطی توکن بات:
# توی محیط لوکال از فایل .dev.vars خونده می‌شه (نمونه‌اش .dev.vars.example هست).
# روی سرور Cloudflare با این دستور ست می‌شه (و اینجا نوشته نمی‌شه، چون secret است):
#   npx wrangler secret put BALE_TOKEN
# ---------------------------------------------------------------------------
